# Build portfolio + Quartz notes as one site
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "main-site/dist"

# Node 22 required for Quartz
[build.environment]
  NODE_VERSION = "22"

# Main site redirects (content/ → notes)
[[redirects]]
  from = "/content"
  to = "/content/notes.html"
  status = 200

[[redirects]]
  from = "/content/"
  to = "/content/notes.html"
  status = 200
